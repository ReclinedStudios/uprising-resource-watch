name: Uprising resource watch

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      import_history:
        description: Import reported SWGAide history before this check (usually once)
        type: boolean
        default: false
      post_summary:
        description: Post a current strong-stat resource shortlist to Discord
        type: boolean
        default: false
      intro_message_id:
        description: Optional existing setup message ID to update its Home link
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: uprising-resource-watch
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A public repo with a standard runner is required for this zero-cost setup.
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued run must start from the latest saved archive, not its trigger's old SHA.
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check configuration
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" = "true" ]; then
            echo 'This free setup requires a PUBLIC repository and standard runners.'
            exit 1
          fi
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo 'Add the DISCORD_WEBHOOK_URL repository Actions secret first.'
            exit 1
          fi
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Import historical records when requested
        if: ${{ inputs.import_history == true }}
        run: python monitor.py seed-history
      - name: Collect current resources
        id: collect
        run: python monitor.py collect
      - name: Prepare current resource shortlist when requested
        if: ${{ inputs.post_summary == true }}
        run: python monitor.py queue-summary
      - name: Save archive and pending alerts before sending
        run: |
          git config user.name 'Uprising Resource Watch'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json data/records.md
          if ! git diff --cached --quiet; then
            git commit -m 'Save resource archive and pending alerts'
            git push
          fi
      - name: Send Discord alerts
        id: send
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          INTRO_MESSAGE_ID: ${{ inputs.intro_message_id }}
        run: |
          if [ -n "$INTRO_MESSAGE_ID" ]; then
            python monitor.py refresh-intro --message-id "$INTRO_MESSAGE_ID"
          fi
          python monitor.py deliver
      - name: Save delivery progress, including after a partial failure
        if: ${{ always() && steps.send.outcome != 'skipped' }}
        run: |
          git config user.name 'Uprising Resource Watch'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save Discord delivery progress'
            git push
          fi
